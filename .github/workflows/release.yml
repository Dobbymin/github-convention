name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verification without creating a GitHub Release"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check

  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if ! echo "$TAG_NAME" | grep -qE '^v'; then
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          fi
